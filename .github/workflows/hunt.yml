name: hunt
on:
  workflow_dispatch:

concurrency:
  group: hunt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: start
        run: echo "hunter starting"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests eth-account
      - run: python keyhunter.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COLLECTOR: ${{ secrets.COLLECTOR }}
          PYTHONUNBUFFERED: "1"
      - name: commit state
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git commit -m "state" || true
          git push || true